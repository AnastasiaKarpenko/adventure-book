spring:
  application:
    # Shown in every log line.
    name: adventure-book

  datasource:
    # In-memory H2: no installation needed, fresh state on every start.
    # Books are re-imported from JSON at startup.
    url: jdbc:h2:mem:adventurebook

  jpa:
    # Print SQL generated by Hibernate (useful during development).
    show-sql: true
    # Do not keep the DB session open while rendering the HTTP response.
    # All data must be loaded explicitly in the service layer.
    open-in-view: false
    hibernate:
      # Create tables from entities at startup, drop them on shutdown.
      ddl-auto: create-drop

  h2:
    console:
      # Web UI to inspect tables: http://localhost:8080/h2-console
      # JDBC URL: jdbc:h2:mem:adventurebook, user: sa, empty password
      enabled: true